name: image
# Builds deploy/azure/Dockerfile - the image the Container Apps job in deploy/azure/scanner.bicep
# runs - and publishes it to ghcr.io/cloudparity/scanner.
#
#   push to main  ->  :<commit sha> and :latest
#   tag v*        ->  :<tag>, e.g. :v0.1.0
#
# linux/amd64 only: Container Apps runs x86-64. The Dockerfile cross-compiles from the runner's
# native toolchain (--platform=$BUILDPLATFORM), so nothing here is emulated.
on:
  push:
    branches: [main]
    tags: ['v*']

# GITHUB_TOKEN is enough to push a package owned by this repository. No PAT, no OIDC.
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cloudparity/scanner

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # `go mod download` runs INSIDE the docker build, where the runner's module cache is
      # invisible. Staging it into the build context as .gomodcache/ lets the Dockerfile serve
      # it as a file:// module proxy (see the COPY there), so a cache hit downloads nothing.
      # go.sum still checks every module, whichever proxy answered.
      - name: stage the module cache for the docker build
        run: |
          go mod download
          cp -r "$(go env GOMODCACHE)/cache/download" .gomodcache

      - name: tags
        id: tags
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tags=$IMAGE:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:$GITHUB_SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: docker build
        run: docker build --platform linux/amd64 -f deploy/azure/Dockerfile -t "$IMAGE:build" .

      # The binary with no arguments prints its usage and exits 2. Anything else - an image
      # that does not start, a binary built for the wrong architecture, an entrypoint that
      # moved - fails here, before the image is published.
      - name: smoke
        run: |
          out="$(docker run --rm "$IMAGE:build" 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q '^usage: scanner ' || { echo "the image did not print the scanner usage"; exit 1; }

      - name: docker login ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: push
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          for t in $TAGS; do
            docker tag "$IMAGE:build" "$t"
            docker push "$t"
          done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:build" 2>/dev/null | sed 's/.*@//')"
          {
            echo "### Published"
            for t in $TAGS; do echo "- \`$t\`"; done
            echo "- digest \`${digest:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The install template pulls this image anonymously: no registry credential is granted
      # to the job, so a private package fails every customer deployment on image pull.
      # Visibility is a package setting, not something a workflow can change, so this only
      # warns - loudly - rather than failing the push that just happened.
      - name: check the package is publicly pullable
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          repo="${IMAGE#ghcr.io/}"
          token="$(curl -sf "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" | jq -r '.token // empty')"
          if [ -z "$token" ]; then
            echo "::warning::ghcr.io/${repo} is not anonymously pullable. Set the package visibility to public: https://github.com/orgs/cloudparity/packages/container/scanner/settings"
            exit 0
          fi
          for t in $TAGS; do
            tag="${t##*:}"
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
                    -H 'Accept: application/vnd.oci.image.index.v1+json' \
                    -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
                    -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
                    -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
                    "https://ghcr.io/v2/${repo}/manifests/${tag}")"
            if [ "$code" = 200 ]; then
              echo "$t is anonymously pullable"
            else
              echo "::warning::$t returned HTTP $code to an anonymous pull; the install template will not be able to pull it"
            fi
          done

      # A software bill of materials for the published image, attached to this run as an
      # artifact (sbom.spdx.json). Not a gate: it costs one step and answers "what is in it".
      - name: sbom
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}:build
          format: spdx-json
          artifact-name: sbom.spdx.json
          upload-release-assets: false
