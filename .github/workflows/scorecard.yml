name: scorecard
# OpenSSF Scorecard: an independent read of this repository's supply-chain practices (pinned
# actions, token permissions, branch protection, a security policy, SAST, known
# vulnerabilities). Results are published to https://scorecard.dev/viewer/?uri=github.com/cloudparity/scanner,
# which is what the badge in README.md shows, and uploaded to the Security tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'   # weekly, Monday 06:17 UTC
  # Branch protection is one of the checks; a change to it re-scores without waiting a week.
  branch_protection_rule:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload the SARIF to the Security tab
      id-token: write          # publish_results: the OIDC token proves the run to scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: upload to the security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
