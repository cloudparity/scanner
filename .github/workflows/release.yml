name: release
# On a v* tag: cross-compile the scanner for five platforms, write SHA256SUMS, attest each of
# the six files on its own, and publish a GitHub Release with the binaries, the checksums and
# one Sigstore bundle per file attached. The release body says how to verify a download, names
# the container image digest for the same tag (published by image.yml), and links the
# permissions the scanner asks for.
#
# A tag can point at any commit and never triggers verify, so the build job runs `go test ./...`
# on the tagged commit itself before it builds anything. The release job refuses to publish
# until the image for the same tag is anonymously pullable and carries a provenance
# attestation of its own: a release must never name an image a customer cannot pull or cannot
# verify.
#
# Provenance is a GitHub artifact attestation: a SLSA build-provenance statement, signed with a
# Sigstore certificate that the workflow obtains through OIDC (id-token: write) and stored in
# this repository's attestations API (attestations: write). No signing key exists to leak or
# rotate. There is one statement per file, not one over the lot: actions/attest writes a single
# statement for every subject it is given, so the attest job runs once per file (a matrix over
# what build produced) and each run's bundle is attached beside its file as
# <file>.sigstore.json. A customer verifies a download with
# `gh attestation verify <file> --owner cloudparity`; README.md, "Verify a release".
#
# Three jobs so each grant exists only where it is used: build has nothing beyond contents:
# read, the OIDC and attestation grants live in attest for the seconds a signature takes, and
# only release can write to the repository (the release itself). The build's dist/ crosses
# from job to job as a workflow artifact whose digest download-artifact checks, and the
# release job re-runs `sha256sum -c` on it before it verifies or publishes anything.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/cloudparity/scanner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      files: ${{ steps.build.outputs.files }}
      go: ${{ steps.build.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: go test
        run: go test ./...

      # Static (CGO off), -trimpath so the binary does not record the runner's directory
      # layout, -s -w to drop the symbol table and DWARF. The same flags as the Dockerfile,
      # so a binary and the image built from one commit contain the same code.
      # `files` is the list the attest job fans out over: whatever ended up in dist/, as JSON,
      # so the matrix cannot drift from what was built.
      - name: build
        id: build
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/scanner_${GITHUB_REF_NAME}_${os}_${arch}"
            [ "$os" = windows ] && out="$out.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "$out" ./agent/cmd/scanner
            echo "built $out"
          done
          (cd dist && sha256sum scanner_* > SHA256SUMS && cat SHA256SUMS)
          echo "files=$(ls dist | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "go=$(go version | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # One run per file in dist/. Each produces a SLSA provenance statement whose only subject is
  # that file, signed by this workflow run at this commit, and hands the Sigstore bundle on to
  # the release job as <file>.sigstore.json. The file's name is the artifact's identity in
  # GitHub's API and the bundle's name on the Releases page, which is why the matrix carries
  # the name and not the platform.
  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # mint the OIDC token that Sigstore exchanges for a signing certificate
      attestations: write    # store the signed provenance in this repository's attestations API
    strategy:
      matrix:
        file: ${{ fromJSON(needs.build.outputs.files) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: attest
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ matrix.file }}

      - name: name the bundle after its subject
        env:
          FILE: ${{ matrix.file }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir -p bundles
          cp "$BUNDLE" "bundles/$FILE.sigstore.json"
          ls -l bundles

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.file }}
          path: bundles/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release and upload its assets; this job only
    env:
      GH_REPO: ${{ github.repository }}   # no checkout here, so gh cannot read it off a remote
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist

      # What the Releases page will carry, assembled and checked before anything is verified
      # or published. Every file the build job listed must be in dist/ and still hash as
      # SHA256SUMS says; every one of them must have exactly its own <file>.sigstore.json, and
      # nothing else may be there. Then the six bundles are joined, one per line, into
      # scanner_<tag>.intoto.jsonl: the layout `gh attestation download` writes and
      # `gh attestation verify --bundle` reads (it tries each line and succeeds on the one whose
      # subject is the file). OpenSSF Scorecard's Signed-Releases check scores a release 8 for
      # a *.sigstore.json or *.sig asset and 10 only for an asset ending .intoto.jsonl, so that
      # file is also what the badge is keyed on. FILES is the build job's own list.
      - name: assemble the release assets
        env:
          FILES: ${{ needs.build.outputs.files }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          jsonl="scanner_${GITHUB_REF_NAME}.intoto.jsonl"
          : > "$jsonl"
          while IFS= read -r f; do
            [ -f "$f" ] || { echo "::error::$f was built but is not in dist/"; exit 1; }
            [ -f "$f.sigstore.json" ] || { echo "::error::$f has no bundle"; exit 1; }
            jq -e '.dsseEnvelope | has("payload")' "$f.sigstore.json" > /dev/null \
              || { echo "::error::$f.sigstore.json is not a Sigstore bundle"; exit 1; }
            jq -c . "$f.sigstore.json" >> "$jsonl"
          done < <(echo "$FILES" | jq -r '.[]')
          expected=$(( $(echo "$FILES" | jq 'length') * 2 + 1 ))
          actual=$(ls | wc -l | tr -d ' ')
          [ "$actual" = "$expected" ] || { echo "::error::dist/ holds $actual files, expected $expected"; ls -l; exit 1; }
          echo "release assets:"; ls -l

      # The README's verification commands, run on what was just built and narrowed to this
      # repository (--owner accepts the whole organisation; the job token is certain to see its
      # own repository's attestations): once against the attestations API, once against the
      # bundle attached beside the file, once against the joined .intoto.jsonl. A release whose
      # files do not verify all three ways is not published.
      - name: verify the binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILES: ${{ needs.build.outputs.files }}
        run: |
          cd dist
          jsonl="scanner_${GITHUB_REF_NAME}.intoto.jsonl"
          while IFS= read -r f; do
            ok=0
            for _ in 1 2 3; do
              gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" && { ok=1; break; }
              echo "retrying: the attestation for $f is not yet served by the API"
              sleep 10
            done
            [ "$ok" = 1 ] || { echo "::error::$f does not verify against this repository's attestations"; exit 1; }
            gh attestation verify "$f" --bundle "$f.sigstore.json" --repo "$GITHUB_REPOSITORY" \
              || { echo "::error::$f does not verify against $f.sigstore.json"; exit 1; }
            gh attestation verify "$f" --bundle "$jsonl" --repo "$GITHUB_REPOSITORY" \
              || { echo "::error::$f does not verify against $jsonl"; exit 1; }
          done < <(echo "$FILES" | jq -r '.[]')

      # The image workflow runs on the same tag push, in parallel. Wait for it to publish
      # :<tag>, asking ghcr.io anonymously - with no credential, exactly as the install template
      # does - so the digest named below is one a customer can pull. If it is not there within
      # ten minutes (image.yml failed, or the package is still private), no release is created:
      # fix that and re-run this workflow.
      - name: image digest
        id: image
        run: |
          repo="${IMAGE#ghcr.io/}"
          digest=""
          for _ in $(seq 1 30); do
            token="$(curl -sf "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" | jq -r '.token // empty')"
            if [ -n "$token" ]; then
              digest="$(curl -sI -H "Authorization: Bearer $token" \
                        -H 'Accept: application/vnd.oci.image.index.v1+json' \
                        -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
                        -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
                        -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
                        "https://ghcr.io/v2/${repo}/manifests/${GITHUB_REF_NAME}" \
                        | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" {print $2}')"
            fi
            [ -n "$digest" ] && break
            echo "waiting for $IMAGE:$GITHUB_REF_NAME to be anonymously pullable"
            sleep 20
          done
          if [ -z "$digest" ]; then
            echo "::error::$IMAGE:$GITHUB_REF_NAME is not anonymously pullable: check the image workflow run for this tag and the package visibility, then re-run this workflow"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "digest: $digest"

      # image.yml attests the image in a job that runs after its push, so the attestation can
      # land a little after the tag becomes pullable: allow it five minutes. The check is the
      # README's own command narrowed to this repository, so what the release notes promise has
      # been run at least once before they are published.
      - name: verify the image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 1 15); do
            if gh attestation verify "oci://$IMAGE:$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            echo "waiting for the provenance attestation of $IMAGE:$GITHUB_REF_NAME"
            sleep 20
          done
          echo "::error::$IMAGE:$GITHUB_REF_NAME has no provenance attestation from this repository: check the attest job of the image workflow run for this tag, then re-run this workflow"
          exit 1

      - name: release notes
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          GO: ${{ needs.build.outputs.go }}
        run: |
          tag="$GITHUB_REF_NAME"
          {
            echo "Built from commit \`$GITHUB_SHA\` with $GO:"
            echo '`CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" ./agent/cmd/scanner`.'
            echo
            echo "## Verify a download"
            echo
            echo "Download the binary for your platform and \`SHA256SUMS\` into the same directory, then:"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS --ignore-missing      # macOS: shasum -a 256 -c SHA256SUMS --ignore-missing"
            echo '```'
            echo
            echo "Every attached file carries its own signed build-provenance attestation. To prove a binary was"
            echo "built by this repository's release workflow at commit \`$GITHUB_SHA\` (needs the GitHub CLI, 2.49 or later):"
            echo
            echo '```sh'
            echo "gh attestation verify scanner_${tag}_linux_amd64 --owner cloudparity"
            echo '```'
            echo
            echo "Beside each file is its attestation as a Sigstore bundle, \`<file>.sigstore.json\`: add"
            echo "\`--bundle scanner_${tag}_linux_amd64.sigstore.json\` to verify against the attached copy instead"
            echo "of the API's. \`scanner_${tag}.intoto.jsonl\` is all of the bundles in one file, one per line, and"
            echo "works the same way for any of the files."
            echo
            echo "## Container image"
            echo
            echo '```sh'
            echo "docker pull $IMAGE:$tag"
            echo "gh attestation verify oci://$IMAGE:$tag --owner cloudparity"
            echo '```'
            echo
            echo "Digest: \`$IMAGE@$DIGEST\`. Pin it in \`deploy/azure/scanner.bicep\` (\`image=\`) or a mirror."
            echo "The image's provenance attestation is also pushed to ghcr.io next to the image."
            echo
            echo "## Permissions"
            echo
            echo "What the scanner asks for and what each grant unlocks:"
            echo "[docs/permissions.md](https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/docs/permissions.md)."
          } > notes.md
          cat notes.md

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
