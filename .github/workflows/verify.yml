name: verify
# The gate every pull request has to pass before it can merge. Branch protection on main requires
# this check and a pull request (no direct pushes, administrators included), so main only ever
# holds commits that passed it; every push to main runs it once more at the merge commit.
# No Docker daemon and no cloud credential: everything here runs on the checkout alone.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod so CI can never drift from the module's requirement.
          go-version-file: go.mod
          # Module cache keyed on go.sum: a dependency change misses, a source change hits.
          cache: true
          cache-dependency-path: go.sum

      # deploy/azure/template_test.go compiles the template a customer deploys and checks what
      # the job it declares passes to the scanner. It skips without a Bicep compiler, so one is
      # put on PATH here - a fixed release, checked against a fixed digest - and `go test ./...`
      # below then runs those tests for real instead of skipping them.
      - name: bicep
        env:
          BICEP_VERSION: v0.47.16
          BICEP_SHA256: 64c345a58e0c3e48b1bc98a4e62d6b3adb1d238281297de3400aeafb2697aa5a
        run: |
          curl -sSL -o bicep "https://github.com/Azure/bicep/releases/download/${BICEP_VERSION}/bicep-linux-x64"
          echo "${BICEP_SHA256}  bicep" | sha256sum -c -
          chmod +x bicep && sudo mv bicep /usr/local/bin/bicep
          bicep --version

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "not gofmt-clean; fix with: make fmt"
            exit 1
          fi
      - name: go vet
        # The second line compiles the build-tagged tests (real PostgreSQL containers, a real
        # Azure disk) that `./...` alone cannot see. Vetting is a compile and needs no Docker
        # daemon; running them does, and they stay out of CI (make test-docker).
        run: |
          go vet ./...
          go vet -tags docker,testbed ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build ./...
