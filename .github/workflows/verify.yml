name: verify
# The gate every pull request has to pass before it can merge, and every push to main runs
# again so the branch is known-good at the commit the image and release workflows build from.
# No Docker daemon and no cloud credential: everything here runs on the checkout alone.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod so CI can never drift from the module's requirement.
          go-version-file: go.mod
          # Module cache keyed on go.sum: a dependency change misses, a source change hits.
          cache: true
          cache-dependency-path: go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "not gofmt-clean; fix with: make fmt"
            exit 1
          fi
      - name: go vet
        # The second line compiles the build-tagged tests (real PostgreSQL containers, a real
        # Azure disk) that `./...` alone cannot see. Vetting is a compile and needs no Docker
        # daemon; running them does, and they stay out of CI (make test-docker).
        run: |
          go vet ./...
          go vet -tags docker,testbed ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build ./...
